<header class="topbar">
  <a class="brand" routerLink="/">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="2" y="2" width="24" height="24" rx="7" fill="currentColor"></rect>
      <path
        d="M8 18l5-5 3 3 5-6"
        fill="none"
        stroke="var(--fg-on-accent)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
    <span>FinanceGoals</span>
  </a>
  <div class="actions">
    <app-currency-switcher />
    <app-sign-in />
    <button
      type="button"
      class="icon-button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.current() === 'dark' ? 'Use the light theme' : 'Use the dark theme'"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </div>
</header>
<div class="layout">
  <nav class="sidenav" aria-label="Main">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Overview</a
    >
    <a routerLink="/calculator" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Mortgage calculator</a
    >
    <a routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">Settings</a>
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
