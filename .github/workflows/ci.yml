name: CI

# Build, format and test checks for every pull request to main, and for main itself.
# "Build and test", "Database checks" and "Web" are required checks in the main ruleset; "Infra"
# joins them after this workflow is on main. More test levels (integration, contract, E2E) join as they arrive (#15).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR (superseded runs are cancelled) and one per commit on main (never cancelled).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins 10.0.100 with rollForward latestFeature; the newest 10.0 SDK satisfies it.
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (analyzers, warnings as errors)
        run: dotnet build --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Coverage summary
        if: always()
        run: |
          mapfile -t files < <(find . -name '*.cobertura.xml' -path '*TestResults*' -not -path './.git/*' | sort)
          {
            echo "### Coverage"
            echo
            if [ ${#files[@]} -eq 0 ]; then
              echo "No coverage files found."
            else
              echo "| Test project | Lines covered | Line coverage |"
              echo "| --- | --- | --- |"
              for f in "${files[@]}"; do
                coverage=$(grep -o '<coverage [^>]*>' "$f" | head -n1)
                # Attributes whose value is 0 are omitted from the file.
                covered=$(printf '%s' "$coverage" | sed -n 's/.* lines-covered="\([0-9]*\)".*/\1/p')
                covered=${covered:-0}
                valid=$(printf '%s' "$coverage" | sed -n 's/.* lines-valid="\([0-9]*\)".*/\1/p')
                if [ "${valid:-0}" -eq 0 ]; then
                  echo "| $(basename "$f" .cobertura.xml) | 0 / 0 | n/a (no code measured) |"
                else
                  echo "| $(basename "$f" .cobertura.xml) | $covered / $valid | $(awk -v c="$covered" -v v="$valid" 'BEGIN { printf "%.1f%%", c * 100 / v }') |"
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/TestResults/*.cobertura.xml"
          if-no-files-found: warn

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra:
    name: Infra
    # Compiles and lints the Bicep templates and every parameter file. No Azure sign-in:
    # deploying belongs to the deploy workflow (#21).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Bicep
        run: az bicep install

      - name: Build and lint
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          for params in infra/*.bicepparam; do
            az bicep build-params --file "$params" --stdout > /dev/null
            echo "$params builds"
          done

  database:
    name: Database checks
    # Compares the PR with its base; on main itself there is nothing to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merged migration and seed scripts are unchanged
        run: |
          # New scripts are fine. Changing, renaming or deleting one that is already on main is
          # not: databases that ran it would never see the change. Repeatable scripts may change.
          changed=$(git diff --name-status --diff-filter=MDRT "$BASE_SHA"...HEAD -- db/migrations db/seed)
          if [ -n "$changed" ]; then
            echo "::error::Merged migration or seed scripts were changed. Add a new script instead."
            echo "$changed"
            exit 1
          fi
          echo "No merged migration or seed script changed."

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build the base branch's migrator
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          dotnet build "$RUNNER_TEMP/base/src/FinanceGoals.Migrator" --configuration Release --output "$RUNNER_TEMP/base-migrator"

      - name: Upgrade from the base matches a fresh build
        env:
          FINANCEGOALS_BASE_MIGRATOR: ${{ runner.temp }}/base-migrator/FinanceGoals.Migrator.dll
          FINANCEGOALS_REQUIRE_UPGRADE_CHECK: "1"
        run: >-
          dotnet test --project tests/FinanceGoals.Migrator.Tests --configuration Release
          -- --filter "FullyQualifiedName~UpgradePathTests"
