name: CI

# Build, format and test checks for every pull request to main, and for main itself.
# The "Build and test" job is a required check in the main ruleset. More test levels
# (integration, database, web, contract, E2E) join this workflow as they arrive (#15).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins 10.0.100 with rollForward latestFeature; the newest 10.0 SDK satisfies it.
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (analyzers, warnings as errors)
        run: dotnet build --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Coverage summary
        if: always()
        run: |
          mapfile -t files < <(find . -name '*.cobertura.xml' -path '*TestResults*' -not -path './.git/*' | sort)
          {
            echo "### Coverage"
            echo
            if [ ${#files[@]} -eq 0 ]; then
              echo "No coverage files found."
            else
              echo "| Test project | Line coverage |"
              echo "| --- | --- |"
              for f in "${files[@]}"; do
                rate=$(grep -o '<coverage line-rate="[^"]*"' "$f" | head -n1 | grep -o '[0-9.]*$' || echo 0)
                echo "| $(basename "$f" .cobertura.xml) | $(awk -v r="$rate" 'BEGIN { printf "%.1f%%", r * 100 }') |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/TestResults/*.cobertura.xml"
          if-no-files-found: warn
