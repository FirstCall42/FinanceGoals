name: Images

# Builds the API, migrator and web images (Dockerfiles in src/FinanceGoals.Api, src/FinanceGoals.Migrator
# and web). Pull requests build them as a check ("Images") and push nothing. Each push to main builds
# them once and pushes them to GitHub Container Registry, tagged with the commit SHA. A tag that
# already exists is never rebuilt or overwritten. The deploy workflow (#21) deploys these exact
# images to test and then promotes the same tags to production.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR (superseded runs are cancelled) and one per commit on main (never cancelled).
  group: images-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/FinanceGoals.Api/Dockerfile
          push: false
          cache-from: type=gha,scope=api

      - name: Build the migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/FinanceGoals.Migrator/Dockerfile
          push: false
          cache-from: type=gha,scope=migrator

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha,scope=web

  publish:
    name: Publish images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io; only on main
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide what to build
        id: plan
        run: |
          # Registry names must be lowercase.
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/financegoals"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          for image in api migrator web; do
            tag="$prefix-$image:$GITHUB_SHA"
            if docker buildx imagetools inspect "$tag" > /dev/null 2>&1; then
              echo "$tag exists; not rebuilding it."
              echo "$image=skip" >> "$GITHUB_OUTPUT"
            else
              echo "$image=build" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and push the API image
        if: steps.plan.outputs.api == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/FinanceGoals.Api/Dockerfile
          push: true
          tags: ${{ steps.plan.outputs.prefix }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the migrator image
        if: steps.plan.outputs.migrator == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/FinanceGoals.Migrator/Dockerfile
          push: true
          tags: ${{ steps.plan.outputs.prefix }}-migrator:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Build and push the web image
        if: steps.plan.outputs.web == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.plan.outputs.prefix }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        env:
          PREFIX: ${{ steps.plan.outputs.prefix }}
        run: |
          {
            echo "### Images for $GITHUB_SHA"
            for image in api migrator web; do echo "- \`$PREFIX-$image:$GITHUB_SHA\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
