name: Feature
description: A new capability or an improvement to an existing one
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants what, and why.
      placeholder: As a household member, I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements. Each one should map to at least one test.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Technical notes
      description: Database changes, API endpoints, UI pages, currency or rounding concerns.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - accounts
        - currency
        - debt
        - goals
        - households
        - infra
        - other
    validations:
      required: true
